---
name: Pack
description: Pack plugin and upload artifact
inputs:
  plugin:
    description: Name of the plugin to build
    required: true
    default: ""
  node-version:
    description: Node.js version
    required: true
    default: 20
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup local Turbo cache
      uses: dtinth/setup-github-actions-caching-for-turbo@a0e976d970c2a94366a26984efcef3030e2c0115 # v1

    - name: Install dependencies for - ${{ inputs.plugin }}
      shell: bash
      working-directory: ${{ inputs.plugin }}
      run: |
        yarn install
        if [[ $(git diff --name-only . || true) ]]; then
          echo "After 'yarn install', workspace is dirty! The following files have changed:"
          echo
          git diff --name-only . || true
          exit 42
        fi

    - name: Build - ${{ inputs.plugin }}
      shell: bash
      working-directory: ${{ inputs.plugin }}
      run: |
        yarn tsc
        yarn build
        mkdir ./build-${{ inputs.plugin }}

    - name: Pack - ${{ inputs.plugin }}
      shell: bash
      working-directory: ${{ inputs.plugin }}
      run: |
        npm pack --pack-destination ./build-${{ inputs.plugin }}

    - name: Notify files packed
      shell: bash
      working-directory: build-${{ inputs.plugin }}
      run: |
        ls -l

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v2
      with:
        name: janus-idp-backstage-plugin-scaffolder-backend-module-ansible-0.0.3.tgz
        path: ./build-${{ inputs.plugin }}/janus-idp-backstage-plugin-scaffolder-backend-module-ansible-0.0.3.tgz
